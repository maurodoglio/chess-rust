services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-backend-azure
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - chess-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess-frontend-azure
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - API_URL=${API_URL:-http://localhost:3000}
    networks:
      - chess-network
    depends_on:
      - backend
    restart: always

networks:
  chess-network:
    driver: bridge
