server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Cache static assets
    # Do not aggressively cache dynamically generated config.js
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache CSS and image assets aggressively (assumed to be cache-busted)
    location ~* \.(css|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Cache JavaScript assets without using 'immutable' to allow updates
    location ~* \.js$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
