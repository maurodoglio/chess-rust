services:
  # Backend Web Service
  - type: web
    name: chess-rust-backend
    runtime: docker
    repo: https://github.com/maurodoglio/chess-rust
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info

  # Frontend Static Site
  - type: web
    name: chess-rust-frontend
    runtime: static
    repo: https://github.com/maurodoglio/chess-rust
    region: oregon
    plan: free
    buildCommand: cd frontend && ./build.sh
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: chess-rust-backend
          envVarKey: RENDER_EXTERNAL_URL
